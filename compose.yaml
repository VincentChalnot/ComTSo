services:
  php:
    build:
      context: .
      target: frankenphp_dev
    restart: unless-stopped
    environment:
      # Port-only site address: Traefik terminates TLS and routes by Host() from the outside, while
      # internal callers (e.g. the Mercure publisher at http://php/.well-known/mercure) arrive with `Host: php`.
      CADDY_SITE_ADDRESS: ":80"
      DEFAULT_URI: https://${SERVER_NAME:-comtso.local.sidus.fr}
      # Symfony trusts X-Forwarded-* coming from Traefik (any private-range proxy, i.e. the Docker `proxy` network).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      DATABASE_URL: mysql://${MYSQL_USER:-comtso}:${MYSQL_PASSWORD:-comtso}@database:3306/${MYSQL_DATABASE:-comtso}?serverVersion=mariadb-11.4.0&charset=utf8mb4
      MERCURE_URL: ${CADDY_MERCURE_URL:-http://php/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-comtso.local.sidus.fr}/.well-known/mercure}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/10-app.ini:/usr/local/etc/php/app.conf.d/10-app.ini:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
    depends_on:
      - database
    networks:
      - default
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-proxy}"
      traefik.http.routers.comtso.rule: "Host(`${SERVER_NAME:-comtso.local.sidus.fr}`)"
      traefik.http.routers.comtso.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.comtso.tls: "true"
      traefik.http.routers.comtso.tls.certresolver: "${CERT_RESOLVER:-gandi}"
      # FrankenPHP/Caddy listens on plain HTTP port 80 inside the container (see CADDY_SITE_ADDRESS).
      traefik.http.services.comtso.loadbalancer.server.port: "80"

  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-comtso}
      MYSQL_USER: ${MYSQL_USER:-comtso}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-comtso}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - database_data:/var/lib/mysql
      - ./docker/database/10-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    ports:
      - "${DATABASE_PORT:-3307}:3306"

  # --- Temporary services for the one-shot legacy reimport (see docs/legacy-import.md). Not started by default:
  #     docker compose --profile legacy up -d legacy-mysql legacy-postgres
  legacy-mysql:
    profiles: ["legacy"]
    image: mariadb:11.4
    # The 2004-2007 dump is MySQL 5.7 flavoured (MyISAM, zero dates, latin1 tables): load it with a permissive sql_mode.
    command: ["--sql-mode=NO_AUTO_VALUE_ON_ZERO", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=256M", "--max-allowed-packet=256M"]
    environment:
      MARIADB_ROOT_PASSWORD: ${LEGACY_MYSQL_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${LEGACY_MYSQL_DATABASE:-comtso_oldphp}
    volumes:
      - ./var/legacy/comtso.sql:/docker-entrypoint-initdb.d/10-comtso.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  legacy-postgres:
    profiles: ["legacy"]
    image: postgres:16-alpine
    # The dump runs `CREATE ROLE "comtso2" WITH SUPERUSER`: the bootstrap superuser must therefore NOT be called comtso2.
    environment:
      POSTGRES_USER: ${LEGACY_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${LEGACY_PG_PASSWORD:-legacy}
      POSTGRES_DB: ${LEGACY_PG_DATABASE:-comtso2}
    volumes:
      - ./var/legacy/dump_20260925_084618_full.sql:/legacy/phpbb3.sql:ro
      - ./docker/legacy/10-load-phpbb3.sh:/docker-entrypoint-initdb.d/10-load-phpbb3.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LEGACY_PG_USER:-postgres} -d ${LEGACY_PG_DATABASE:-comtso2}"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  node:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run build -- --watch"
    depends_on:
      - php

# Mercure is installed as a Caddy module, prevent the Flex recipe from installing another service
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###


networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}

volumes:
  caddy_data:
  caddy_config:
  database_data:
