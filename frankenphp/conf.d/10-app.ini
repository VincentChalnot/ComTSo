expose_php = 0
date.timezone = Europe/Paris
apc.enable_cli = 1
session.use_strict_mode = 1
zend.detect_unicode = 0

; https://symfony.com/doc/current/performance.html
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 32531
opcache.memory_consumption = 256
opcache.enable_file_override = 1

; GD decodes a photo to 4 bytes per pixel: App\Photo\PhotoPipeline accepts sources up to 100 megapixels (refused from the header,
; before decoding) and refuses, with a French message, any image that would not fit in what is left of this limit.
memory_limit = 768M

; Photos: up to 10 pictures of at most 10 MB per message (App\Photo\PostPhotos::MAX_PER_POST, App\Service\PhotoUploader::MAX_SIZE).
; post_max_size must hold a full message: 10 x 10 MB + the text, with room to spare.
upload_max_filesize = 10M
post_max_size = 128M
max_file_uploads = 20
