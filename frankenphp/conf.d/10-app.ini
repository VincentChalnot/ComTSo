expose_php = 0
date.timezone = Europe/Paris
apc.enable_cli = 1
session.use_strict_mode = 1
zend.detect_unicode = 0

; https://symfony.com/doc/current/performance.html
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 32531
opcache.memory_consumption = 256
opcache.enable_file_override = 1

; Large phone photos need a lot of memory for GD to decode when generating thumbnails.
memory_limit = 512M

; Photos attached to messages: up to 10 pictures of at most 25 MB per message (App\Photo\PostPhotos::MAX_PER_POST,
; App\Service\PhotoUploader::MAX_SIZE). post_max_size must hold a full message: 10 x 25 MB + the text.
upload_max_filesize = 25M
post_max_size = 256M
max_file_uploads = 20
