# Admin panel (/admin, ROLE_ADMIN only): sidus/admin-bundle (screens, routes), sidus/datagrid-bundle (lists) and
# sidus/filter-bundle (the filters and sorting of a list: configured INLINE under `query_handler`, there is no separate
# `sidus_filter` block). See "Admin panel" in AGENTS.md before adding a screen.
#
# Conventions of every screen below:
#  - `permissions: [ROLE_ADMIN]` (on top of `access_control: ^/admin` in security.yaml);
#  - explicit `methods` on every action: the bundle routes are `ANY` by default, which would hide them from the POST/CSRF
#    audit of tests/Security/CsrfTest.php. Pages that only read are GET; forms and confirmation pages are GET + POST;
#  - destructive actions never go through the bundle's raw `DeleteAction` (EntityManager::remove): they are the custom
#    actions of src/Admin/Action (confirmation page on GET, removal on POST with the form token);
#  - `sortable` and the filter `attributes` are explicit allow-lists of properties (App\Admin\Action\ListAction also
#    refuses any other sort column coming from the request).
sidus_admin:
    base_template: admin/base.html.twig
    configurations:
        # Members: list with filters, enable/disable + administrator role, removal through App\Forum\UserRemover.
        # No create (accounts are made with `app:user:create`) and no e-mail address anywhere.
        user:
            entity: App\Entity\User
            prefix: /users
            # first match wins: custom action of this screen, the guarded list, then the bundle's own
            controller_pattern: &controllers ['App\Admin\Action\{{Admin}}\{{Action}}Action', 'App\Admin\Action\{{Action}}Action', 'Sidus\AdminBundle\Action\{{Action}}Action']
            template_pattern: &templates ['@SidusAdmin/Action/{{action}}.{{format}}.twig']
            permissions: &permissions [ROLE_ADMIN]
            form_type: App\Form\Admin\UserAdminType
            options: { subject: username }
            actions:
                list: { path: /, methods: [GET] }
                edit: { path: '/{id}/edit', requirements: { id: '\d+' }, methods: [GET, POST] }
                delete: { path: '/{id}/delete', requirements: { id: '\d+' }, methods: [GET, POST] }

        # Forums: create/edit and removal of EMPTY forums only (App\Admin\Action\Forum\DeleteAction). The identifier is the slug.
        forum:
            entity: App\Entity\Forum
            prefix: /forums
            controller_pattern: *controllers
            template_pattern: *templates
            permissions: *permissions
            form_type: App\Form\Admin\ForumAdminType
            options: { subject: title }
            actions:
                list: { path: /, methods: [GET] }
                create: { path: /new, methods: [GET, POST] }
                edit: { path: '/{id}/edit', requirements: { id: '[a-z0-9-]+' }, methods: [GET, POST] }
                delete: { path: '/{id}/delete', requirements: { id: '[a-z0-9-]+' }, methods: [GET, POST] }

        # Quotes: full CRUD, the bundle's own delete action (a quote has no dependants: confirmation page + POST with the form token).
        quote:
            entity: App\Entity\Quote
            prefix: /quotes
            controller_pattern: *controllers
            template_pattern: *templates
            permissions: *permissions
            form_type: App\Form\Admin\QuoteAdminType
            actions:
                list: { path: /, methods: [GET] }
                create: { path: /new, methods: [GET, POST] }
                edit: { path: '/{id}/edit', requirements: { id: '\d+' }, methods: [GET, POST] }
                delete: { path: '/{id}/delete', requirements: { id: '\d+' }, methods: [GET, POST] }

        # Topics: READ-ONLY list (no edit/create: members write topics on the forum). Removal = the moderation one (TopicRemover).
        topic:
            entity: App\Entity\Topic
            prefix: /topics
            controller_pattern: *controllers
            template_pattern: *templates
            permissions: *permissions
            actions:
                list: { path: /, methods: [GET] }
                delete: { path: '/{id}/delete', requirements: { id: '\d+' }, methods: [GET, POST] }

sidus_data_grid:
    default_datagrid_template: admin/datagrid.html.twig
    configurations:
        user:
            query_handler:
                provider: doctrine
                options: { entity: App\Entity\User }
                results_per_page: 25
                sortable: [username, enabled, registeredAt, lastActivity, lastLogin]
                default_sort: { username: ASC }
                filters:
                    username: { type: text, label: admin.user.filter.username }
                    enabled:
                        type: choice
                        label: admin.user.filter.enabled
                        form_options:
                            placeholder: admin.list.all
                            choices: { admin.user.status.enabled: true, admin.user.status.disabled: false }
                    role:
                        type: admin_role
                        attributes: [roles]
                        label: admin.user.filter.role
                        form_options:
                            placeholder: admin.list.all
                            choices: { admin.user.role.admin_plural: admin, admin.user.role.member_plural: member }
                    lastActivity: { type: date_range, label: admin.user.filter.last_activity }
            columns:
                username: { template: admin/cells/edit_link.html.twig, template_vars: { badge_self: true } }
                enabled:
                    template: admin/cells/badge.html.twig
                    template_vars: { on: admin.user.status.enabled, off: admin.user.status.disabled, on_class: badge-ok, off_class: badge-muted }
                admin: { property_path: roles, template: admin/user/_role_cell.html.twig }
                registeredAt: { template: admin/cells/date.html.twig, template_vars: { format: d/m/Y } }
                lastActivity: { template: admin/cells/date.html.twig }
                lastLogin: { template: admin/cells/date.html.twig }
                actions:
                    property_path: id
                    template: admin/cells/actions.html.twig
                    template_vars: { actions: [edit, delete], subject: username, skip_for_self: [delete] }
                    attributes: { class: table-actions }
        forum:
            query_handler:
                provider: doctrine
                options: { entity: App\Entity\Forum }
                results_per_page: 50
                sortable: [order, title, createdAt]
                default_sort: { order: ASC }
                filters:
                    title: { type: text, label: admin.forum.filter.title }
            columns:
                order: ~
                title: { template: admin/cells/edit_link.html.twig }
                id: { template: admin/cells/code.html.twig }
                topics: { property_path: id, template: admin/forum/_topics_cell.html.twig }
                createdAt: { template: admin/cells/date.html.twig, template_vars: { format: d/m/Y } }
                actions:
                    property_path: id
                    template: admin/cells/actions.html.twig
                    template_vars: { actions: [edit, delete], subject: title }
                    attributes: { class: table-actions }
        quote:
            query_handler:
                provider: doctrine
                options: { entity: App\Entity\Quote }
                results_per_page: 25
                sortable: [id, originalAuthor, createdAt]
                default_sort: { id: DESC }
                filters:
                    text: { type: text, attributes: [content, originalAuthor], label: admin.quote.filter.text }
            columns:
                content: { template: admin/cells/excerpt.html.twig, template_vars: { link: true, length: 140 } }
                originalAuthor: ~
                author: { property_path: "author?.username", template: admin/cells/author.html.twig }
                createdAt: { template: admin/cells/date.html.twig, template_vars: { format: d/m/Y } }
                actions:
                    property_path: id
                    template: admin/cells/actions.html.twig
                    template_vars: { actions: [edit, delete] }
                    attributes: { class: table-actions }
        topic:
            query_handler:
                provider: doctrine
                options: { entity: App\Entity\Topic }
                results_per_page: 25
                sortable: [title, forum.title, author.username, commentCount, createdAt, lastActivityAt]
                default_sort: { lastActivityAt: DESC }
                filters:
                    title: { type: text, label: admin.topic.filter.title }
                    forum:
                        type: entity
                        label: admin.topic.filter.forum
                        form_options: { placeholder: admin.list.all_forums }
                    author: { type: text, attributes: [author.username], label: admin.topic.filter.author }
            columns:
                title: { template: admin/topic/_title_cell.html.twig }
                forum: { property_path: forum.title, sort_column: forum.title }
                author: { property_path: "author?.username", sort_column: author.username, template: admin/cells/author.html.twig }
                commentCount: { attributes: { class: num } }
                createdAt: { template: admin/cells/date.html.twig, template_vars: { format: d/m/Y } }
                lastActivityAt: { template: admin/cells/date.html.twig }
                actions: { property_path: id, template: admin/topic/_actions_cell.html.twig, attributes: { class: table-actions } }
