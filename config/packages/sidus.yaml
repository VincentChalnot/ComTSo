# Admin panel (/admin, ROLE_ADMIN only): sidus/admin-bundle (screens, routes), sidus/datagrid-bundle (lists) and
# sidus/filter-bundle + sidus/doctrine-filter-bundle (the filters and sorting of a list: configured INLINE under `list`
# of each datagrid, there is no separate `sidus_filter` block). See "Admin panel" in AGENTS.md before adding a screen.
#
# Conventions of every screen below:
#  - `permissions: [ROLE_ADMIN]` (on top of `access_control: ^/admin` in security.yaml);
#  - explicit `methods` on every action: the bundle routes are `ANY` by default, which would hide them from the POST/CSRF
#    audit of tests/Security/CsrfTest.php. Pages that only read are GET; forms and confirmation pages are GET + POST;
#  - destructive actions never go through the bundle's raw `DeleteAction` (EntityManager::remove): they are the custom
#    actions of src/Admin/Action (confirmation page on GET, removal on POST with the form token);
#  - the sortable columns and the filter `attributes` are explicit allow-lists of properties (the sort input names a column
#    key, never a property path, so a request can only sort on what a column declares).
sidus_admin:
    base_template: admin/base.html.twig
    configurations:
        # Members: list with filters, enable/disable + administrator role, removal through App\Forum\UserRemover.
        # No create (accounts are made with `app:user:create`). The ONLY screen that shows e-mail addresses (list and edit page).
        user:
            entity: App\Entity\User
            prefix: /users
            # first match wins: custom action of this screen, the app's shared one, then the bundle's own
            controller_pattern: &controllers ['App\Admin\Action\{{Admin}}\{{Action}}Action', 'App\Admin\Action\{{Action}}Action', 'Sidus\AdminBundle\Action\{{Action}}Action']
            permissions: &permissions [ROLE_ADMIN]
            form_type: App\Form\Admin\UserAdminType
            options: { subject: username }
            actions:
                list: { path: /, methods: [GET] }
                edit: { path: '/{id}/edit', requirements: { id: '\d+' }, methods: [GET, POST] }
                delete: { path: '/{id}/delete', requirements: { id: '\d+' }, methods: [GET, POST] }

        # Forums: create/edit and removal of EMPTY forums only (App\Admin\Action\Forum\DeleteAction). The identifier is the slug.
        forum:
            entity: App\Entity\Forum
            prefix: /forums
            controller_pattern: *controllers
            permissions: *permissions
            form_type: App\Form\Admin\ForumAdminType
            options: { subject: title }
            actions:
                list: { path: /, methods: [GET] }
                create: { path: /new, methods: [GET, POST] }
                edit: { path: '/{id}/edit', requirements: { id: '[a-z0-9-]+' }, methods: [GET, POST] }
                delete: { path: '/{id}/delete', requirements: { id: '[a-z0-9-]+' }, methods: [GET, POST] }

        # Topics: READ-ONLY list (no edit/create: members write topics on the forum). Removal = the moderation one (TopicRemover).
        topic:
            entity: App\Entity\Topic
            prefix: /topics
            controller_pattern: *controllers
            permissions: *permissions
            actions:
                list: { path: /, methods: [GET] }
                delete: { path: '/{id}/delete', requirements: { id: '\d+' }, methods: [GET, POST] }

        # Comments (the messages of the topics): READ-ONLY list, latest first. Removal = the moderation one (CommentRemover).
        comment:
            entity: App\Entity\Comment
            prefix: /comments
            controller_pattern: *controllers
            permissions: *permissions
            options: { subject: id }
            actions:
                list: { path: /, methods: [GET] }
                delete: { path: '/{id}/delete', requirements: { id: '\d+' }, methods: [GET, POST] }

        # Photos: READ-ONLY list; removal only through App\Photo\PhotoRemover (the file and its thumbnails go with the row).
        photo:
            entity: App\Entity\Photo
            prefix: /photos
            controller_pattern: *controllers
            permissions: *permissions
            options: { subject: originalFilename }
            actions:
                list: { path: /, methods: [GET] }
                delete: { path: '/{id}/delete', requirements: { id: '\d+' }, methods: [GET, POST] }

        # Quotes: full CRUD, the bundle's own delete action (a quote has no dependants: confirmation page + POST with the form token).
        quote:
            entity: App\Entity\Quote
            prefix: /quotes
            controller_pattern: *controllers
            permissions: *permissions
            form_type: App\Form\Admin\QuoteAdminType
            actions:
                list: { path: /, methods: [GET] }
                create: { path: /new, methods: [GET, POST] }
                edit: { path: '/{id}/edit', requirements: { id: '\d+' }, methods: [GET, POST] }
                delete: { path: '/{id}/delete', requirements: { id: '\d+' }, methods: [GET, POST] }

sidus_data_grid:
    # The admin lists share one template (design system: filter bar, `.table`, `.pager`); it extends the bundle's base layout.
    default_theme: admin/datagrid.html.twig
    # Each datagrid is `columns` (what is shown, `sortable` = the column is a sort key: true or the attribute path to sort by),
    # `default_sort` and an inline `list` (the filters, the page size) on the Doctrine provider. The sort filter is generated.
    configurations:
        user:
            default_sort: [{ column: username, direction: asc }]
            columns:
                username: { sortable: true, template: admin/cells/edit_link.html.twig, template_vars: { badge_self: true } }
                email: { sortable: true, attributes: { class: nowrap } }
                enabled:
                    sortable: true
                    template: admin/cells/badge.html.twig
                    template_vars: { on: admin.user.status.enabled, off: admin.user.status.disabled, on_class: badge-ok, off_class: badge-muted }
                admin: { property_path: roles, template: admin/user/_role_cell.html.twig }
                registeredAt: { sortable: true, template: admin/cells/date.html.twig, template_vars: { format: d/m/Y }, attributes: { class: nowrap } }
                lastActivity: { sortable: true, template: admin/cells/date.html.twig, attributes: { class: nowrap } }
                lastLogin: { sortable: true, template: admin/cells/date.html.twig, attributes: { class: nowrap } }
                actions:
                    property_path: id
                    template: admin/cells/actions.html.twig
                    template_vars: { actions: [edit, delete], subject: username, skip_for_self: [delete] }
                    attributes: { class: table-actions }
            list:
                provider: doctrine
                options: { entity: App\Entity\User }
                pagination: { per_page: 25 }
                filters:
                    username: { type: text, form: { label: admin.user.filter.username } }
                    email: { type: text, form: { label: admin.user.filter.email } }
                    enabled:
                        type: choice
                        options: { choices: { admin.user.status.enabled: 1, admin.user.status.disabled: 0 } }
                        form: { label: admin.user.filter.enabled, options: { placeholder: admin.list.all } }
                    role:
                        type: admin_role
                        attributes: [roles]
                        form:
                            label: admin.user.filter.role
                            options:
                                placeholder: admin.list.all
                                choices: { admin.user.role.admin_plural: admin, admin.user.role.member_plural: member }
                    lastActivity:
                        type: date_range
                        options: { timezone: Europe/Paris }
                        form: { label: admin.user.filter.last_activity }
        forum:
            default_sort: [{ column: order, direction: asc }]
            columns:
                order: { sortable: true }
                title: { sortable: true, template: admin/cells/edit_link.html.twig }
                id: { template: admin/cells/code.html.twig }
                topics: { property_path: id, template: admin/forum/_topics_cell.html.twig }
                createdAt: { sortable: true, template: admin/cells/date.html.twig, template_vars: { format: d/m/Y } }
                actions:
                    property_path: id
                    template: admin/cells/actions.html.twig
                    template_vars: { actions: [edit, delete], subject: title }
                    attributes: { class: table-actions }
            list:
                provider: doctrine
                options: { entity: App\Entity\Forum }
                pagination: { per_page: 50 }
                filters:
                    title: { type: text, form: { label: admin.forum.filter.title } }
        topic:
            default_sort: [{ column: lastActivityAt, direction: desc }]
            columns:
                title: { sortable: true, template: admin/topic/_title_cell.html.twig }
                forum: { property_path: forum.title, sortable: forum.title }
                author: { property_path: "author?.username", sortable: author.username, template: admin/cells/author.html.twig }
                commentCount: { sortable: true, attributes: { class: num } }
                createdAt: { sortable: true, template: admin/cells/date.html.twig, template_vars: { format: d/m/Y } }
                lastActivityAt: { sortable: true, template: admin/cells/date.html.twig }
                actions: { property_path: id, template: admin/topic/_actions_cell.html.twig, attributes: { class: table-actions } }
            list:
                provider: doctrine
                options: { entity: App\Entity\Topic }
                pagination: { per_page: 25 }
                filters:
                    title: { type: text, form: { label: admin.topic.filter.title } }
                    forum:
                        type: relation
                        options: { class: App\Entity\Forum }
                        form:
                            label: admin.topic.filter.forum
                            options: { choice_label: title, placeholder: admin.list.all_forums }
                    author: { type: text, attributes: [author.username], form: { label: admin.topic.filter.author } }
        comment:
            default_sort: [{ column: createdAt, direction: desc }]
            columns:
                id: { sortable: true, attributes: { class: num } }
                createdAt: { sortable: true, template: admin/cells/date.html.twig, attributes: { class: nowrap } }
                author: { property_path: "author?.username", sortable: author.username, template: admin/cells/author.html.twig }
                topic: { property_path: topic.title, sortable: topic.title, template: admin/comment/_topic_cell.html.twig }
                content: { template: admin/comment/_excerpt_cell.html.twig }
                photos: { property_path: id, template: admin/comment/_photos_cell.html.twig, attributes: { class: num } }
                actions: { property_path: id, template: admin/comment/_actions_cell.html.twig, attributes: { class: table-actions } }
            list:
                provider: doctrine
                options: { entity: App\Entity\Comment }
                pagination: { per_page: 25 }
                filters:
                    content: { type: text, form: { label: admin.comment.filter.content } }
                    author: { type: text, attributes: [author.username], form: { label: admin.comment.filter.author } }
                    topic: { type: text, attributes: [topic.title], form: { label: admin.comment.filter.topic } }
                    createdAt:
                        type: date_range
                        options: { timezone: Europe/Paris }
                        form: { label: admin.comment.filter.created_at }
        photo:
            default_sort: [{ column: createdAt, direction: desc }]
            columns:
                thumb: { property_path: id, template: admin/photo/_thumb_cell.html.twig }
                originalFilename: { sortable: true, template: admin/photo/_name_cell.html.twig }
                author: { property_path: "author?.username", sortable: author.username, template: admin/cells/author.html.twig }
                fileSize: { sortable: true, template: admin/photo/_size_cell.html.twig, attributes: { class: num } }
                dimensions: { property_path: id, template: admin/photo/_dimensions_cell.html.twig, attributes: { class: num } }
                takenAt: { sortable: true, template: admin/cells/date.html.twig, template_vars: { format: d/m/Y } }
                createdAt: { sortable: true, template: admin/cells/date.html.twig, template_vars: { format: d/m/Y } }
                usage: { property_path: id, template: admin/photo/_usage_cell.html.twig }
                actions: { property_path: id, template: admin/photo/_actions_cell.html.twig, attributes: { class: table-actions } }
            list:
                provider: doctrine
                options: { entity: App\Entity\Photo }
                pagination: { per_page: 25 }
                filters:
                    name: { type: text, attributes: [title, originalFilename], form: { label: admin.photo.filter.name } }
                    author: { type: text, attributes: [author.username], form: { label: admin.photo.filter.author } }
                    takenAt:
                        type: date_range
                        options: { timezone: Europe/Paris }
                        form: { label: admin.photo.filter.taken_at }
        quote:
            default_sort: [{ column: id, direction: desc }]
            columns:
                content: { template: admin/cells/excerpt.html.twig, template_vars: { link: true, length: 140 } }
                originalAuthor: { sortable: true }
                author: { property_path: "author?.username", template: admin/cells/author.html.twig }
                createdAt: { sortable: true, template: admin/cells/date.html.twig, template_vars: { format: d/m/Y } }
                id: { sortable: true, attributes: { class: num } }
                actions:
                    property_path: id
                    template: admin/cells/actions.html.twig
                    template_vars: { actions: [edit, delete] }
                    attributes: { class: table-actions }
            list:
                provider: doctrine
                options: { entity: App\Entity\Quote }
                pagination: { per_page: 25 }
                filters:
                    text: { type: text, attributes: [content, originalAuthor], form: { label: admin.quote.filter.text } }
