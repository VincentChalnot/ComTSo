security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        # Passwords from the old forum (see App\Security\LegacyPasswordHasher)
        legacy_sha512:
            id: App\Security\LegacyPasswordHasher
        # The first entry matching the user wins, so no generic interface entry may precede this one.
        # Not "auto": with "auto" Symfony ignores migrate_from.
        App\Entity\User:
            algorithm: native
            migrate_from:
                - legacy_sha512

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            # 5 failed attempts per username + IP address and per 15 minutes (25 per IP address in total): then even the
            # right password is refused until the window slides. A success resets the counter of that username.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
                cache_pool: limiter.cache
            logout:
                path: app_logout
                target: app_home
                # Stateless token (see csrf.yaml): use {{ logout_path() }}, a bare /logout link is refused.
                enable_csrf: true
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                always_remember_me: true
                # `secure` follows framework.session.cookie_secure (true in production).
                httponly: true
                samesite: lax
                # Changing the password invalidates every remember-me cookie issued before.
                signature_properties: [password]

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # The forum is completely private: everything requires a logged-in user, except the login page
    # (and the registration page, which redirects to /login unless REGISTRATION_ENABLED=true).
    # Note: Only the *first* access control that matches will be used.
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/mot-de-passe/(oublie|reinitialiser)$, roles: PUBLIC_ACCESS }
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        - { path: ^/register$, roles: PUBLIC_ACCESS }
        # The admin panel (sidus/admin-bundle, config/packages/sidus.yaml) is for administrators only; each screen repeats it in `permissions`.
        - { path: ^/admin(/|$), roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Secure hashes are slow on purpose; tests do not need that, so use the lowest bcrypt cost.
            App\Entity\User:
                algorithm: native
                cost: 4
                migrate_from:
                    - legacy_sha512
        firewalls:
            main:
                login_throttling:
                    # Same limits as production, counted in memory (see config/packages/framework.yaml).
                    storage_service: app.limiter.storage
