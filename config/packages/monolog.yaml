monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - audit # Security-relevant events (failed logins, password-reset mails): always written in production, see when@prod

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            # Security-relevant events: every one, as it happens (notice and above), JSON on stderr.
            audit:
                type: stream
                path: php://stderr
                level: notice
                channels: [audit]
                formatter: monolog.formatter.json
            # Everything else: silent until an error occurs, then the last 50 records (up to info) leading to it are written.
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!audit"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
            # Deprecations are for developers: dropped in production.
            deprecation:
                type: "null"
                channels: [deprecation]
