# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Photos are private: stored outside public/ and only served through authenticated controllers.
    # In dev, ./var/photos is bind-mounted from the host (see compose.override.yaml).
    photos_directory: '%kernel.project_dir%/var/photos/originals'
    photos_cache_directory: '%kernel.project_dir%/var/photos/cache'
    # Open registration feature flag (REGISTRATION_ENABLED=true|false, default false).
    app.registration_enabled: '%env(bool:REGISTRATION_ENABLED)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\ImageProcessingService:
        arguments:
            $photosDirectory: '%photos_directory%'
            $cacheDirectory: '%photos_cache_directory%'

when@test:
    parameters:
        # Tests must never read or write the real photo library.
        photos_directory: '%kernel.project_dir%/var/test-photos/originals'
        photos_cache_directory: '%kernel.project_dir%/var/test-photos/cache'
