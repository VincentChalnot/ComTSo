# French labels of the admin panel (config/packages/sidus.yaml). The rest of the UI is written in the templates.
# Keys: admin.<screen>.* (screen = the code in sidus.yaml), admin.list.* / admin.button.* (shared),
# datagrid.<screen>.<column> (column heads, looked up by the datagrid bundle), admin.<screen>.filter.* (filters),
# sidus.admin.flash.* and sidus.admin.<screen>.<action>.success (flash messages of the bundle actions).
admin:
    button:
        save: Enregistrer
        create: Créer
        cancel: Annuler
        delete: Supprimer définitivement
    list:
        filters: Filtres
        filter: Filtrer
        reset: Réinitialiser
        date_from: depuis le
        date_to: jusqu’au
        count: '{0} Aucun résultat|{1} %count% résultat|]1,Inf[ %count% résultats'
        page: 'Page %page% sur %pages%'
        empty: Aucun résultat pour ces critères.
        yes: Oui
        no: Non
        all: Tous
        all_forums: Tous les forums
        you: vous
    delete:
        irreversible: Cette action est définitive.
    action:
        edit: Modifier
        delete: Supprimer
        view: Voir sur le forum
        edit_for: Modifier %name%
        delete_for: Supprimer %name%
        view_for: Voir %name% sur le forum
    user:
        title: Membres
        description: Activer ou désactiver un compte, nommer un administrateur, supprimer un membre. Les adresses e-mail ne sont jamais affichées.
        edit: Modifier le membre
        delete: Supprimer le membre
        delete_confirm: 'Supprimer le membre « %entity% » ?'
        status:
            enabled: Actif
            disabled: Désactivé
        role:
            member: Membre
            admin: Administrateur
            member_plural: Membres
            admin_plural: Administrateurs
        field:
            enabled: Compte actif
            enabled_help: Un compte désactivé ne peut plus se connecter, ses messages restent affichés.
            role: Rôle
        filter:
            username: Pseudo
            enabled: Compte
            role: Rôle
            last_activity: Dernière activité
        impact:
            topics: '{1} 1 sujet, avec tous les messages des autres membres qu’il contient|]1,Inf[ %count% sujets, avec tous les messages des autres membres qu’ils contiennent'
            comments: '{1} 1 message dans les sujets d’autres membres|]1,Inf[ %count% messages dans les sujets d’autres membres'
            privateMessages: '{1} 1 message privé, envoyé ou reçu|]1,Inf[ %count% messages privés, envoyés ou reçus'
            chatMessages: '{1} 1 message du chat|]1,Inf[ %count% messages du chat'
    forum:
        title: Forums
        description: Créer, renommer, ordonner un forum. Seul un forum vide (sans aucun sujet) peut être supprimé.
        new: Nouveau forum
        edit: Modifier le forum
        delete: Supprimer le forum
        delete_confirm: 'Supprimer le forum « %entity% » ?'
        not_empty: '{1} Le forum « %forum% » contient encore 1 sujet : supprimez-le d’abord (page du sujet), un forum n’est supprimé que vide.|]1,Inf[ Le forum « %forum% » contient encore %count% sujets : supprimez-les d’abord (page de chaque sujet), un forum n’est supprimé que vide.'
        topics_count: '{0} aucun sujet|{1} 1 sujet|]1,Inf[ %count% sujets'
        field:
            title: Titre
            order: Position
            order_help: Les forums sont classés par position croissante, puis par titre.
            content: Description
            content_help: Affichée sous le titre du forum. Le titre fixe l’adresse du forum à la création ; elle ne change plus ensuite.
        filter:
            title: Titre
    quote:
        title: Citations
        description: Les citations tirées au hasard dans la colonne de droite de chaque page. Texte brut.
        new: Nouvelle citation
        edit: Modifier la citation
        delete: Supprimer la citation
        delete_confirm: 'Supprimer la citation « %entity% » ?'
        field:
            content: Citation
            original_author: Auteur de la citation
            original_author_help: La personne qui l’a dite ou écrite, telle qu’elle doit apparaître sous la citation.
        filter:
            text: Texte ou auteur
    topic:
        title: Sujets
        description: Tous les sujets du forum, en lecture seule. Pour en modifier un, ouvrez-le sur le forum ; ici on peut seulement le supprimer.
        delete: Supprimer le sujet
        delete_confirm: 'Supprimer le sujet « %entity% » ?'
        impact: '{0} Aucun message ne sera supprimé avec lui.|{1} Son message sera supprimé avec lui, ainsi que les liens vers ses photos.|]1,Inf[ Ses %count% messages seront supprimés avec lui, ainsi que les liens vers ses photos.'
        filter:
            title: Titre
            forum: Forum
            author: Auteur

datagrid:
    topic:
        title: Titre
        forum: Forum
        author: Auteur
        commentCount: Messages
        createdAt: Création
        lastActivityAt: Dernier message
        actions: Actions
    quote:
        id: N°
        content: Citation
        originalAuthor: Auteur
        author: Ajoutée par
        createdAt: Ajoutée le
        actions: Actions
    forum:
        order: Position
        title: Titre
        id: Adresse
        topics: Sujets
        createdAt: Création
        actions: Actions
    user:
        username: Pseudo
        enabled: Compte
        admin: Rôle
        registeredAt: Inscription
        lastActivity: Dernière activité
        lastLogin: Dernière connexion
        actions: Actions

sidus:
    admin:
        flash:
            create:
                success: L’élément a été créé.
            edit:
                success: Les modifications sont enregistrées.
            delete:
                success: L’élément a été supprimé.
        topic:
            delete:
                success: Le sujet a été supprimé.
        quote:
            create:
                success: La citation a été ajoutée.
            edit:
                success: La citation a été mise à jour.
            delete:
                success: La citation a été supprimée.
        forum:
            create:
                success: Le forum a été créé.
            edit:
                success: Le forum a été mis à jour.
            delete:
                success: Le forum vide a été supprimé.
        user:
            delete:
                success: Le membre a été supprimé, avec ce qu’il avait écrit.
            edit:
                success: Le membre a été mis à jour.
