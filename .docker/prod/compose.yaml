services:
  staging:
    build: ./staging/.docker/php-fpm
    restart: 'no'
    working_dir: /var/www/html
    volumes:
      - /etc/localtime:/etc/localtime
      - ./staging/.docker/php-fpm/conf.d/symfony.ini:/usr/local/etc/php/conf.d/symfony.ini
      - ./staging:/var/www/html
      - ./shared/app/config/parameters.yml:/var/www/html/app/config/parameters.yml
      - ./shared/app/data:/var/www/html/app/data
      - ./shared/app/logs:/var/www/html/app/logs
    environment:
      COMPOSER_MEMORY_LIMIT: -1
    command: [composer, install, --no-ansi, --no-dev, --no-interaction, --no-progress, --optimize-autoloader]

  php-fpm:
    build: ./current/.docker/php-fpm
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - /etc/localtime:/etc/localtime
      - ./current/.docker/php-fpm/conf.d/symfony.ini:/usr/local/etc/php/conf.d/symfony.ini
      - ./current:/var/www/html
      - ./shared/app/config/parameters.yml:/var/www/html/app/config/parameters.yml
      - ./shared/app/data:/var/www/html/app/data
      - ./shared/app/logs:/var/www/html/app/logs

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - php-fpm
    networks:
      default: ~
      proxy:
        aliases:
          - '${DOMAIN_NAME}'
    volumes:
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./staging:/var/www/html
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.comtso.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.comtso.entrypoints=https"
      - "traefik.http.routers.comtso.tls=true"
      - "traefik.http.routers.comtso.tls.certresolver=le"

  mysql:
    image: mariadb:10.3
    restart: unless-stopped
    volumes:
      - volume_mysql:/var/lib/mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
      MYSQL_DATABASE: comtso
      MYSQL_USER: comtso
      MYSQL_PASSWORD: '${MYSQL_PASSWORD}'

networks:
  default:
  proxy:
    name: proxy
    external: true

volumes:
  volume_mysql:
    driver: local
