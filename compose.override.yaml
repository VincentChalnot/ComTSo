---
# Development environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Keep var/ off the bind-mount for faster I/O on Mac/Windows; comment to inspect from the host.
      - /app/var
      # Legacy photo originals and database dumps used by app:legacy:import
      - ./var/photos:/app/var/photos
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      FRANKENPHP_SITE_CONFIG: hot_reload
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
      APP_ENV: "${APP_ENV:-dev}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true
  # Design-system showcase (dev only, NOT in compose.yaml nor in the production image): Vite dev server compiling the same
  # Sass/Tailwind sources as the application. http://localhost:${DESIGN_SYSTEM_PORT:-5174}/  (plain HTTP, published on the host)
  design-system:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    # `node` runs `npm install`; wait for it instead of racing it on the shared bind mount
    command: sh -c "until [ -x node_modules/.bin/vite ] && [ -d node_modules/sass ]; do sleep 2; done; npm run design-system"
    environment:
      DESIGN_SYSTEM_INTERNAL_PORT: "5174"
    ports:
      - "${DESIGN_SYSTEM_PORT:-5174}:5174"
    depends_on:
      - node

