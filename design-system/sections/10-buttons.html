<section class="ds-section" id="boutons" data-title="Boutons">
  <header class="ds-section-head">
    <p class="kicker">Composants</p>
    <h2>Boutons</h2>
    <p class="standfirst">Des onglets de papier : la couleur de l’élément est le fond, le carton kraft est posé par-dessus en pseudo-élément. La recette de fusion est recalculée pour chaque variante, chaque état et chaque thème.</p>
  </header>

  <div class="ds-demo" data-title="Variantes">
    <div class="ds-stage ds-row">
        <button type="button" class="btn">Défaut</button>
        <button type="button" class="btn btn-primary">Primaire</button>
        <button type="button" class="btn btn-secondary">Secondaire</button>
        <button type="button" class="btn btn-highlight">Sable</button>
        <button type="button" class="btn btn-danger">Supprimer</button>
        <button type="button" class="btn btn-ghost">Fantôme</button>
    </div>
  </div>

  <div class="ds-demo" data-title="États forcés — survol · pressé · focus clavier · désactivé">
    <div class="ds-stage ds-col">
      <div class="ds-row"><span class="ds-label" style="width:6rem;margin:0">repos</span>
        <button type="button" class="btn">Défaut</button>
        <button type="button" class="btn btn-primary">Primaire</button>
        <button type="button" class="btn btn-secondary">Secondaire</button>
        <button type="button" class="btn btn-highlight">Sable</button>
        <button type="button" class="btn btn-danger">Supprimer</button>
        <button type="button" class="btn btn-ghost">Fantôme</button>
      </div>
      <div class="ds-row"><span class="ds-label" style="width:6rem;margin:0">is-hover</span>
        <button type="button" class="btn is-hover">Défaut</button>
        <button type="button" class="btn btn-primary is-hover">Primaire</button>
        <button type="button" class="btn btn-secondary is-hover">Secondaire</button>
        <button type="button" class="btn btn-highlight is-hover">Sable</button>
        <button type="button" class="btn btn-danger is-hover">Supprimer</button>
        <button type="button" class="btn btn-ghost is-hover">Fantôme</button>
      </div>
      <div class="ds-row"><span class="ds-label" style="width:6rem;margin:0">is-pressed</span>
        <button type="button" class="btn is-pressed">Défaut</button>
        <button type="button" class="btn btn-primary is-pressed">Primaire</button>
        <button type="button" class="btn btn-secondary is-pressed">Secondaire</button>
        <button type="button" class="btn btn-highlight is-pressed">Sable</button>
        <button type="button" class="btn btn-danger is-pressed">Supprimer</button>
        <button type="button" class="btn btn-ghost is-pressed">Fantôme</button>
      </div>
      <div class="ds-row"><span class="ds-label" style="width:6rem;margin:0">is-focus</span>
        <button type="button" class="btn is-focus">Défaut</button>
        <button type="button" class="btn btn-primary is-focus">Primaire</button>
        <button type="button" class="btn btn-secondary is-focus">Secondaire</button>
        <button type="button" class="btn btn-highlight is-focus">Sable</button>
        <button type="button" class="btn btn-danger is-focus">Supprimer</button>
        <button type="button" class="btn btn-ghost is-focus">Fantôme</button>
      </div>
      <div class="ds-row"><span class="ds-label" style="width:6rem;margin:0">disabled</span>
        <button type="button" class="btn" disabled>Défaut</button>
        <button type="button" class="btn btn-primary" disabled>Primaire</button>
        <button type="button" class="btn btn-secondary" disabled>Secondaire</button>
        <button type="button" class="btn btn-highlight" disabled>Sable</button>
        <button type="button" class="btn btn-danger" disabled>Supprimer</button>
        <button type="button" class="btn btn-ghost" disabled>Fantôme</button>
      </div>
    </div>
  </div>

  <div class="ds-demo" data-title="Tailles et icônes">
    <div class="ds-stage ds-row">
      <button type="button" class="btn btn-primary btn-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>Petit</button>
      <button type="button" class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>Normal</button>
      <button type="button" class="btn btn-primary btn-lg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>Grand</button>
      <a class="btn btn-secondary" href="#boutons">Lien-bouton</a>
      <button type="button" class="btn btn-icon" aria-label="Favori"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
      <button type="button" class="btn btn-icon is-hover" aria-label="Modifier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg></button>
      <button type="button" class="btn btn-icon btn-sm" aria-label="Supprimer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
    </div>
  </div>

  <div class="ds-demo" data-title="Groupe et bloc">
    <div class="ds-stage ds-col" style="max-width:26rem">
      <div class="btn-group"><button type="button" class="btn">Jour</button><button type="button" class="btn btn-primary">Semaine</button><button type="button" class="btn">Mois</button></div>
      <button type="button" class="btn btn-primary btn-lg btn-block">Se connecter</button>
    </div>
  </div>
</section>
