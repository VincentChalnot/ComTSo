name: CI

# Tests on every push to the default branch and on pull requests; the production image is built on the same events
# (in parallel with the tests) and pushed to ghcr.io only after the tests passed, for the default branch and `v*` tags
# (never for pull requests). Docs-only changes do not trigger a run.
#
# Job graph:    base ─┬─ test ─────┐
#                     ├─ image ────┼─ publish (push only)   (`image` also smoke-tests the production image)
#               frontend ──────────┤
#               gitleaks ──────────┘
#               audit (advisory)
on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', '.idea/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.idea/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes the run in progress (it republishes `latest` anyway); a release tag is never cancelled.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # The base image (system packages + PHP extensions: the slow part of any build) is published as
  # ghcr.io/<owner>/<repo>-base:<hash of the Dockerfile base block> and only rebuilt when that block changes.
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      # The published image, or `php_base` (the Dockerfile stage, compiled locally with the gha cache) when it cannot be pushed.
      ref: ${{ steps.ref.outputs.ref }}
    env:
      # Fork and Dependabot pull requests have a read-only token.
      CAN_PUSH: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@v7

      # compose.yaml (dev) pins the same tag: fail when someone edited the base block without `docker/base-hash.sh --write`.
      - name: Check the pinned base tag
        run: docker/base-hash.sh --check

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is the base image already published?
        id: ref
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-base:$(docker/base-hash.sh)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ref=$image" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            if [ "$CAN_PUSH" = true ]; then echo "ref=$image" >> "$GITHUB_OUTPUT"; else echo "ref=php_base" >> "$GITHUB_OUTPUT"; fi
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.ref.outputs.exists == 'false'

      # Without push rights the build only warms the gha cache, which the other jobs read to build the stage locally.
      - name: Build the base image
        if: steps.ref.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: php_base
          push: ${{ env.CAN_PUSH == 'true' }}
          tags: ${{ steps.ref.outputs.image }}
          provenance: false
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

  test:
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      # Second copy of the dev stack on a CI runner: no Traefik router for it.
      TRAEFIK_ENABLE: 'false'
    steps:
      - uses: actions/checkout@v7

      # The dev compose file reads its (throwaway) secrets from .env and joins the external Traefik network.
      - name: Prepare the dev stack inputs
        run: |
          cp .env.example .env
          docker network create proxy

      - name: Validate the compose files
        run: |
          docker compose config -q
          docker compose -f deploy/compose.yaml --env-file deploy/.env.example config -q
          docker compose -f deploy/compose.yaml -f deploy/compose.traefik.yaml --env-file deploy/.env.example config -q
          docker compose -f deploy/compose.yaml -f deploy/compose.traefik.yaml -f deploy/compose.www-redirect.yaml --env-file deploy/.env.example config -q

      - uses: docker/login-action@v3
        if: needs.base.outputs.ref != 'php_base'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # Same image as `docker compose up` (target frankenphp_dev) on top of the published base, loaded into the local Docker daemon
      # under the name compose.yaml expects. The gha cache holds the thin layers (and the base stage when it had to be built locally).
      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frankenphp_dev
          build-args: BASE_IMAGE=${{ needs.base.outputs.ref }}
          load: true
          tags: comtso-php-dev
          cache-from: |
            type=gha,scope=dev
            type=gha,scope=base
          cache-to: type=gha,scope=dev,mode=max

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      # Scripts are skipped: cache:clear/assets:install need the runtime environment of the stack, they run lazily there.
      - name: Install PHP dependencies
        run: >
          docker run --rm -e COMPOSER_AUTH -v "$PWD:/app" -w /app comtso-php-dev
          composer install --no-progress --no-interaction --prefer-dist --no-scripts
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

      # `database` is healthy first (compose `depends_on`); the php entrypoint then migrates the dev database.
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300 php

      - name: Migrate the test database
        run: docker compose exec -T -e APP_ENV=test php bin/console doctrine:migrations:migrate --no-interaction

      - name: Validate the Doctrine schema
        run: docker compose exec -T -e APP_ENV=test php bin/console doctrine:schema:validate

      - name: Lint Twig, YAML and the service container
        run: |
          docker compose exec -T php bin/console lint:twig templates
          docker compose exec -T php bin/console lint:yaml config translations
          docker compose exec -T php bin/console lint:container

      - name: PHPUnit
        run: docker compose exec -T php vendor/bin/phpunit

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail=200

  # Independent of PHP: runs alongside `test`.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Build the front-end
        run: |
          npm ci
          npm run build

      - name: WCAG AA contrast check
        run: npm run contrast

  # Secret scan of the whole git history (blocking). `.gitleaks.toml` allows only the owner-accepted development findings.
  # The pinned official image is used rather than gitleaks-action: no token, no licence, same version as the one run locally.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the history for secrets
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source /repo --config /repo/.gitleaks.toml --redact --verbose --no-banner

  # Advisory for now (continue-on-error): flip to blocking once the dependency tree is clean.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Composer audit (non-blocking)
        continue-on-error: true
        run: docker run --rm -v "$PWD:/app" -w /app composer:2 audit --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: npm audit (non-blocking)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # Builds the production image (every event, so a broken Dockerfile fails the pull request) while the tests run. Only fills the
  # gha cache: `publish` below reuses it to push in seconds once the tests passed.
  image:
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        if: needs.base.outputs.ref != 'php_base'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # `load: true` keeps the image in the runner's Docker daemon (under a local-only tag) for the smoke test below; nothing is pushed.
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frankenphp_prod
          build-args: BASE_IMAGE=${{ needs.base.outputs.ref }}
          load: true
          tags: ghcr.io/vincentchalnot/comtso:ci-smoke
          provenance: false
          cache-from: |
            type=gha,scope=prod
            type=gha,scope=base
          cache-to: type=gha,scope=prod,mode=max

      # Runs the image the way production does: deploy/compose.yaml (migrate, app, a throwaway MariaDB) with secrets generated on the
      # fly, plain HTTP on loopback. Proves that the image boots, migrates an empty database and serves: /health answers `ok`
      # (Caddy + PHP + database) and the private forum sends an anonymous visitor to /login.
      - name: Smoke-test the production image
        env:
          COMPOSE_FILE: deploy/compose.yaml
          COMPOSE_PROJECT_NAME: comtso-smoke
          COMTSO_IMAGE_TAG: ci-smoke
          SERVER_NAME: smoke.invalid
          CADDY_SITE_ADDRESS: ':80'
          HTTP_BIND: '127.0.0.1:8080'
          HTTPS_BIND: '127.0.0.1:8443'
          # Throwaway secrets, valid for this job only (compose turns each into a /run/secrets file).
          MAILER_DSN: 'null://null'
        run: |
          APP_SECRET=$(openssl rand -hex 32)
          DATABASE_PASSWORD=$(openssl rand -hex 16)
          DATABASE_ROOT_PASSWORD=$(openssl rand -hex 16)
          MERCURE_JWT_SECRET=$(openssl rand -hex 32)
          export APP_SECRET DATABASE_PASSWORD DATABASE_ROOT_PASSWORD MERCURE_JWT_SECRET
          # Only the database image comes from the registry; the app image is the one built above and must never be pulled.
          docker compose pull database
          docker compose up -d --no-build --pull never
          for _ in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health)" = 200 ] && break
            sleep 2
          done
          test "$(curl -sS http://127.0.0.1:8080/health)" = ok
          headers="$(curl -sS -o /dev/null -D - http://127.0.0.1:8080/ | tr -d '\r')"
          echo "$headers"
          echo "$headers" | head -n 1 | grep -qE '^HTTP/[0-9.]+ 302'
          echo "$headers" | grep -iqE '^location: .*/login$'

      - name: Smoke-test logs
        if: failure()
        env:
          COMPOSE_FILE: deploy/compose.yaml
          COMPOSE_PROJECT_NAME: comtso-smoke
          COMTSO_IMAGE_TAG: ci-smoke
        run: |
          export SERVER_NAME=smoke.invalid APP_SECRET=x DATABASE_PASSWORD=x DATABASE_ROOT_PASSWORD=x MERCURE_JWT_SECRET=x MAILER_DSN=x
          docker compose ps -a
          docker compose logs --no-color --tail=200

  publish:
    if: github.event_name != 'pull_request'
    needs: [base, test, frontend, image, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest = default branch; sha-<short> = every pushed build; 1.2.3 / 1.2 = git tag v1.2.3
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Push the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frankenphp_prod
          build-args: BASE_IMAGE=${{ needs.base.outputs.ref }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: |
            type=gha,scope=prod
            type=gha,scope=base
